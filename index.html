<style>
:root{--bg:#11131b;--panel:#202431;--line:#4a5268;--mint:#a7ffd8;--red:#ff526b;--violet:#b68cff;--text:#e9ecf6;--muted:#a2a9bc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;touch-action:pan-y}button,input{font:inherit}button{border:1px solid #59627a;background:#252b3b;color:var(--text);border-radius:7px;padding:9px 12px;cursor:pointer;min-height:38px}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}.hidden{display:none!important}#desktop{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 70% 30%,#29354a 0,#161c2b 35%,#0c1019 78%);isolation:isolate}#wallpaper{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 40%,#4a32641a 40% 42%,transparent 42%),radial-gradient(circle at 20% 80%,#5de8bc12,transparent 30%)}#icons{position:absolute;top:12px;left:10px;display:grid;grid-template-columns:76px 76px;gap:10px;z-index:1}.deskicon{border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;min-height:74px;text-shadow:0 2px 4px #000}.deskicon:active,.deskicon:hover{background:#ffffff13;border-color:#ffffff20}.glyph{font-size:27px;filter:drop-shadow(0 2px 4px #000)}#taskbar{position:absolute;bottom:0;left:0;right:0;min-height:48px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;background:#10131deF;border-top:1px solid #4d5368;z-index:1000;backdrop-filter:blur(12px)}#startBtn{background:#2b5b51;border-color:#5dbca1;font-weight:800}#taskApps{display:flex;gap:5px;overflow:auto;flex:1}#taskApps button{white-space:nowrap;padding:6px 9px;min-height:34px}#clock{font-variant-numeric:tabular-nums;color:var(--mint);font-size:12px;min-width:42px;text-align:right}.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 18px));max-height:calc(100dvh - 112px);background:#171c29f7;border:1px solid #68728a;border-radius:10px;box-shadow:0 18px 60px #0009;overflow:hidden;display:flex;flex-direction:column;z-index:20;backdrop-filter:blur(14px)}.win.max{width:calc(100vw - 10px);height:calc(100dvh - 60px);max-height:none;left:5px;top:5px;transform:none}.titlebar{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#293449,#202536);padding:9px 8px 9px 12px;border-bottom:1px solid #566078;touch-action:none;user-select:none;min-height:43px}.winname{font-weight:750;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.winctrl{display:flex;gap:4px}.winctrl button{padding:2px 8px;min-height:28px;border-radius:5px}.winctrl .close{color:#ffb5bf;border-color:#85404b}.content{padding:14px;overflow:auto;overscroll-behavior:contain}.content h2,.content h3{margin:0 0 10px}.muted{color:var(--muted)}.green{color:var(--mint)}.red{color:var(--red)}.purple{color:var(--violet)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:10px}.tile{border:1px solid #3e475e;border-radius:8px;background:#1b2130;padding:11px}.tile strong{display:block;margin-bottom:4px}.terminal{background:#070b10;border:1px solid #2c5a4c;border-radius:7px;padding:10px;min-height:130px;color:#a7ffd8;font:13px/1.55 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow:auto}.termrow{display:flex;gap:6px;margin-top:8px}.termrow input{min-width:0;flex:1;background:#0b1018;color:#caffeb;border:1px solid #3a6e5c;border-radius:7px;padding:10px}.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.progress{height:6px;background:#0a0d14;border-radius:10px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--violet));transition:width .2s}.popupShade{position:absolute;inset:0;background:#05070c70;z-index:900;display:grid;place-items:center;padding:14px}.popup{width:min(390px,100%);border:1px solid #b83b55;border-radius:10px;background:#190f18;box-shadow:0 0 60px #f03a5738;padding:17px;animation:appear .18s ease-out}.popup h2{font-size:clamp(21px,5vw,28px);margin:4px 0 8px;color:#fff}.popup .code{font:12px ui-monospace,monospace;color:#ff8294}.popup .row{justify-content:flex-end;margin-top:14px}@keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}.scanlines:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 4px);z-index:800;opacity:.35}.glitching{animation:glitch .18s steps(2) infinite}@keyframes glitch{0%{filter:hue-rotate(0) contrast(1)}50%{filter:hue-rotate(45deg) contrast(1.5)}100%{filter:hue-rotate(-35deg) contrast(1.1)}}.battlebox{position:relative;height:220px;border:2px solid #e9ecf6;border-radius:4px;background:#080a11;overflow:hidden;touch-action:none;margin:10px 0}.soul{position:absolute;width:14px;height:14px;background:#ff435a;transform:rotate(45deg);box-shadow:0 0 10px #ff435a;left:50%;top:75%}.bullet{position:absolute;width:12px;height:22px;background:#f4f5ff;border-radius:3px;box-shadow:0 0 8px #fff}.arenaNote{font-size:12px;color:#aeb6cb}.mobileControls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.mobileControls button{min-width:52px;font-size:18px}.maze{display:grid;grid-template-columns:repeat(7,minmax(20px,1fr));gap:4px;max-width:350px;margin:12px auto}.cell{aspect-ratio:1/1;min-height:24px;border-radius:4px;padding:0;min-width:0;background:#111827;border:1px solid #333d53}.cell.wall{background:#3b4153}.cell.you{background:#5de0b2;color:#09110f;font-weight:900}.cell.exit{border-color:#b68cff;background:#33234b}.cell.visited{background:#243b3a}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{flex:1}.tiny{font-size:11px}.toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:850;background:#111723;border:1px solid #6b748b;border-radius:8px;padding:10px 14px;max-width:calc(100% - 24px);box-shadow:0 8px 24px #0008;text-align:center}.desktopNotice{position:absolute;bottom:58px;left:12px;font-size:11px;color:#aab1c4;pointer-events:none}.startmenu{position:absolute;bottom:52px;left:8px;width:min(290px,calc(100vw - 16px));background:#171c29f7;border:1px solid #59647b;border-radius:10px;padding:12px;z-index:990;box-shadow:0 12px 36px #0008}.startmenu button{width:100%;text-align:left;margin:3px 0}.meter{display:inline-block;border:1px solid #4a5268;border-radius:20px;padding:3px 8px;font-size:11px}.ending{background:radial-gradient(circle at center,#302044,#080a10 70%);text-align:center;padding:22px}.ending h1{font-size:clamp(25px,7vw,42px);letter-spacing:2px;color:#ff6680}.smallprint{font-size:11px;color:#a5acc0;margin-top:8px}
@media(min-width:700px){#icons{grid-template-columns:84px 84px;gap:12px}.win{width:min(600px,calc(100vw - 40px))}.content{padding:18px}.battlebox{height:260px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div id="desktop"><div id="wallpaper"></div><div id="icons">
<button class="deskicon" data-open="files"><span class="glyph">📁</span><span>Мои файлы</span></button><button class="deskicon" data-open="browser"><span class="glyph">🌐</span><span>Браузер</span></button><button class="deskicon" data-open="notes"><span class="glyph">📝</span><span>Блокнот</span></button><button class="deskicon" data-open="terminal"><span class="glyph">▣</span><span>Терминал</span></button><button class="deskicon" data-open="arcade"><span class="glyph">🎮</span><span>Аркада</span></button><button class="deskicon" data-open="settings"><span class="glyph">⚙️</span><span>Настройки</span></button>
</div><div class="desktopNotice" id="desktopNotice">CORRUPTED OS • локальная симуляция • build 0xVOID</div><div id="windows"></div><div id="taskbar"><button id="startBtn">◈ ПУСК</button><div id="taskApps"></div><div id="clock">00:00</div></div><div id="startmenu" class="startmenu hidden"><strong>CORRUPTED OS</strong><p class="muted tiny">Что открыть?</p><div class="stack"><button data-open="browser">🌐 Браузер</button><button data-open="files">📁 Мои файлы</button><button data-open="notes">📝 Блокнот</button><button data-open="terminal">▣ Терминал</button><button data-open="arcade">🎮 Аркада</button><button data-open="settings">⚙️ Настройки</button><hr style="border:0;border-top:1px solid #3e475e;width:100%"><button id="resetAllBtn" type="button">↻ ПОЛНЫЙ СБРОС ПРОГРЕССА</button></div></div><div id="popupShade" class="popupShade hidden"><div class="popup"><div class="row"><span class="red">⚠</span><strong id="popupHead">SYSTEM ERROR</strong><span class="meter">0xVOID</span></div><h2 id="popupMessage">Ты никуда не уйдешь :)</h2><p id="popupDesc" class="muted">Попытка перехода заблокирована.</p><div class="code" id="popupCode">КОД ОШИБКИ: 0x0000VOID</div><div class="row"><button id="popupClose">ПОНЯТНО</button></div></div></div><div id="toast" class="toast hidden"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const defaultState={startedAt:0,lastSeen:0,stage:0,seenEvents:[],flags:{},notes:'Не забыть: 7 / 1 / 4 / 2?\nКто-то удалил половину этого файла.',inventory:['потёртая дискета'],trust:0,chaos:0,bossWins:0,chaseWins:0,ending:'',puzzleSolved:false,archiveSolved:false,glitchSolved:false,secretCount:0,attempts:0};
let state;try{state={...defaultState,...JSON.parse(localStorage.getItem('corruptedOS_save')||'{}')};state.flags=state.flags||{};state.seenEvents=state.seenEvents||[];state.inventory=state.inventory||[];}catch(e){state={...defaultState,flags:{},seenEvents:[],inventory:[]};}
const save=()=>{state.lastSeen=Date.now();try{localStorage.setItem('corruptedOS_save',JSON.stringify(state));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let z=30,openWindows={},topId=null,popupTimer=null,started=false,stageTimer=null,glitchTimer=null,toastTimer=null,battle=null,chase=null;
const appInfo={files:['Мои файлы','📁'],browser:['Браузер','🌐'],notes:['Блокнот','📝'],terminal:['Терминал','▣'],arcade:['Аркада','🎮'],settings:['Настройки','⚙️'],monika:['poem.txt — неизвестный автор','♡'],battle:['SOUL.EXE — бой','♥'],chase:['TRANSIT ERROR — погоня','▧'],archive:['АРХИВ: 0xVOID','⌁']};
function toast(msg,ms=2400){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),ms)}
function showError(message='Ты никуда не уйдешь :)',desc='Попытка перехода заблокирована.',code='0x0000VOID',duration=0){$('#popupHead').textContent=state.stage>=3?'ACCESS DENIED':'SYSTEM ERROR';$('#popupMessage').textContent=message;$('#popupDesc').textContent=desc;$('#popupCode').textContent='КОД ОШИБКИ: '+code;$('#popupShade').classList.remove('hidden');if(duration){clearTimeout(popupTimer);popupTimer=setTimeout(()=>$('#popupShade').classList.add('hidden'),duration)}}
$('#popupClose').addEventListener('click',()=>{$('#popupShade').classList.add('hidden');if(state.stage>=3&&Math.random()<.42){setTimeout(()=>showError('Я СКАЗАЛ НЕТ :)','Окно не было закрыто. Оно просто перестало показываться.','0xC1A0ED',1500),400)}});
function isLocked(){return state.stage>=3&&!state.flags.freePass}
function openApp(id,force=false){$('#startmenu').classList.add('hidden');if(!appInfo[id])return;if(isLocked()&&!force&&!['terminal'].includes(id)){state.chaos++;save();showError('Ты никуда не уйдешь :)','Операционная система отклонила переход.','0x0000VOID');if(state.chaos%3===0)disturb();return}
 if(openWindows[id]){const w=openWindows[id];w.style.zIndex=++z;w.classList.remove('hidden');topId=id;renderTaskbar();return}
 const win=document.createElement('section');win.className='win';win.dataset.id=id;win.style.zIndex=++z;win.innerHTML=`<div class="titlebar"><span>${appInfo[id][1]}</span><div class="winname">${appInfo[id][0]}</div><div class="winctrl"><button data-min="1" aria-label="Свернуть">−</button><button data-max="1" aria-label="Развернуть">□</button><button class="close" data-close="1" aria-label="Закрыть">×</button></div></div><div class="content">${contentFor(id)}</div>`;$('#windows').appendChild(win);openWindows[id]=win;topId=id;attachWindow(win);renderTaskbar();wireContent(id,win);
 if(state.stage>=2&&Math.random()<.15) setTimeout(()=>{if(openWindows[id]===win&&state.stage>=2)win.querySelector('.winname').textContent='НЕ ТРОГАЙ ЭТО';},1400);
}
function contentFor(id){switch(id){case'files':return filesHTML();case'browser':return browserHTML();case'notes':return `<h2>Блокнот</h2><p class="muted">Локальный документ. Автосохранение включено.</p><textarea id="notesText" style="width:100%;min-height:190px;background:#0c111b;color:#e9ecf6;border:1px solid #46516b;border-radius:7px;padding:10px;resize:vertical">${esc(state.notes)}</textarea><div class="row" style="margin-top:9px"><button data-action="saveNotes">Сохранить</button><button data-action="decryptNotes">Восстановить удалённый текст</button></div><p id="notesMsg" class="muted tiny">Последнее изменение сохранено локально.</p>`;case'terminal':return terminalHTML();case'arcade':return arcadeHTML();case'settings':return settingsHTML();case'monika':return monikaHTML();case'battle':return battleHTML();case'chase':return chaseHTML();case'archive':return archiveHTML();default:return '<p>Приложение не найдено.</p>'}}
function filesHTML(){let files=[['readme.txt','Обычная инструкция. Ничего необычного.','readme'],['old_backup.bak','Резервная копия: дата неизвестна','backup'],['poem.txt','Создан сегодня, хотя компьютер был выключен.','poem'],['door_7.dat','Файл повреждён.','door'],['monika.chr','Неизвестный формат персонажа.','monika'],['soul.fragment','Найден фрагмент данных.','soul'],['glitch.log','Журнал ошибок перехода.','glitch']];return `<h2>Мои файлы</h2><p class="muted">Локальный диск C: /Users/guest</p><div class="stack">${files.map(f=>`<button style="text-align:left" data-file="${f[2]}">📄 <strong>${f[0]}</strong><br><span class="muted tiny">${f[1]}</span></button>`).join('')}</div><p class="smallprint">Некоторые файлы видны только после определённых событий.</p>`}
function browserHTML(){return `<h2>Браузер</h2><div class="termrow"><input id="urlInput" value="https://welcome.local" aria-label="Адрес сайта" inputmode="url" autocomplete="off"><button data-action="goUrl">Перейти</button></div><div id="webPage" class="tile" style="margin-top:12px"><h3>Welcome.local</h3><p>Добро пожаловать! Это безопасная локальная демонстрация.</p><div class="row"><button data-page="forum">Форум</button><button data-page="help">Помощь</button><button data-page="404">Случайная страница</button></div></div><p class="muted tiny">Внутренний браузер CORRUPTED OS — симуляция. Настоящие сайты не открываются.</p>`}
function terminalHTML(){return `<h2>Терминал</h2><div class="terminal" id="termOut">CORRUPTED OS Terminal [build 0xVOID]\nВведите help для списка команд.\nГостевая сессия активна.</div><div class="termrow"><input id="termInput" autocomplete="off" autocapitalize="off" placeholder="guest@void:~$ команда"><button data-action="runTerm">Ввод</button></div><div class="row" style="margin-top:8px"><button data-cmd="help">help</button><button data-cmd="status">status</button><button data-cmd="ls">ls</button></div><p class="muted tiny">Терминал симулируется в браузере и не выполняет команды телефона.</p>`}
function arcadeHTML(){return `<h2>Аркада</h2><p>Системные мини-игры. Рекорды сохраняются локально.</p><div class="stack"><div class="tile"><strong>♥ SOUL RUNNER</strong><span class="muted">Уклоняйся от атак. Вдохновлено классическими RPG-битвами.</span><div style="margin-top:8px"><button data-action="startBattle">Начать битву</button></div></div><div class="tile"><strong>▧ GLITCH TRANSIT</strong><span class="muted">Пройди лабиринт, пока выходы меняются местами.</span><div style="margin-top:8px"><button data-action="startChase">Начать погоню</button></div></div><div class="tile"><strong>♡ Неизвестный автор</strong><span class="muted">Открыть документ, которого не должно быть.</span><div style="margin-top:8px"><button data-action="openMonika">Открыть</button></div></div></div>`}
function settingsHTML(){return `<h2>Настройки системы</h2><div class="stack"><div class="tile"><strong>Пользователь</strong>guest / локальная сессия</div><div class="tile"><strong>Состояние</strong><span class="green">${state.stage<2?'Норма':state.stage<4?'Нестабильно':'Критическое'}</span><div class="progress"><span style="width:${Math.min(100,state.stage*20)}%"></span></div><span class="muted tiny">Уровень аномалий: ${state.stage}/5</span></div><div class="tile"><strong>Специальные возможности</strong><label><input type="checkbox" id="reduceMotion" ${state.flags.reduceMotion?'checked':''}> Уменьшить визуальные помехи</label><br><label><input type="checkbox" id="captions" ${state.flags.captions!==false?'checked':''}> Показывать текстовые подсказки</label></div><div class="row"><button data-action="saveSettings">Сохранить настройки</button><button data-action="exportSave">Экспорт сохранения</button></div><div class="tile"><strong>Полный сброс прогресса</strong><p class="muted tiny">Сотрёт сюжет, аномалии, победы, секреты, концовки, заметки и настройки CORRUPTED OS на этом сайте. После перезапуска игра начнётся с нуля.</p><button data-action="resetGame">СБРОСИТЬ ВСЁ</button></div></div>`}
function monikaHTML(){return `<h2 class="purple">♡ Документ: poem.txt</h2><div class="tile" style="font-family:Georgia,serif;line-height:1.9">Слова мерцают на краю экрана.<br>Курсор ждёт, хотя ты не печатаешь.<br>Если ты читаешь это, значит,<br><span class="purple">кто-то открыл дверь изнутри.</span><p id="poemLast">Я рада, что ты здесь.</p></div><p class="muted">Файл персонажа: monika.chr</p><div class="row"><button data-action="talkMonika">Ответить</button><button data-action="inspectPoem">Осмотреть метаданные</button></div><p id="monikaReply" class="muted"></p>`}
function battleHTML(){return `<h2>SOUL.EXE — испытание души</h2><p class="muted">Держи красное сердце в безопасной зоне. Двигай пальцем по арене или используй кнопки.</p><div class="status"><span id="battlePhase">Фаза 1 / 3</span><span id="battleHP">Ошибки: 0 / 5</span><span id="battleTime">00:20</span></div><div class="battlebox" id="battlebox"><div class="soul" id="soul"></div></div><div class="mobileControls"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><div class="choice"><button data-action="battleFight">FIGHT</button><button data-action="battleAct">ACT</button><button data-action="battleMercy">MERCY</button></div><p id="battleMsg" class="arenaNote">Противник изучает твои движения.</p>`}

function archiveHTML(){return `<h2>АРХИВ: 0xVOID</h2><p>Три системы оставили фрагменты одного сообщения. Собери их, прежде чем архив перезапишется.</p><div class="stack"><div class="tile"><strong>Фрагмент A</strong><span class="muted">Из заметки: 7 / 1 / 4 / 2</span></div><div class="tile"><strong>Фрагмент B</strong><span class="muted">Из терминала: «порядок не совпадает с порядком появления»</span></div><div class="tile"><strong>Фрагмент C</strong><span class="muted">Из журнала: обратный алфавит, сдвиг на 1</span></div></div><p>Введите ключ из четырёх цифр:</p><div class="termrow"><input id="archiveKey" inputmode="numeric" maxlength="4" placeholder="_ _ _ _"><button data-action="solveArchive">Проверить</button></div><p id="archiveMsg" class="muted"></p>`}

function attachWindow(win){const bar=win.querySelector('.titlebar');let active=false,sx=0,sy=0,ox=0,oy=0;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;active=true;win.style.zIndex=++z;topId=win.dataset.id;const r=win.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!active||win.classList.contains('max'))return;const w=win.getBoundingClientRect();let x=ox+e.clientX-sx,y=oy+e.clientY-sy;x=Math.max(-w.width+80,Math.min(innerWidth-80,x));y=Math.max(0,Math.min(innerHeight-65,y));win.style.left=x+'px';win.style.top=y+'px';win.style.transform='none'});bar.addEventListener('pointerup',()=>active=false);bar.addEventListener('pointercancel',()=>active=false);win.querySelector('[data-close]').addEventListener('click',()=>{if(isLocked()&&Math.random()<.7){showError('Куда собрался?','Закрытие окна запрещено.','0xC105E');return}delete openWindows[win.dataset.id];win.remove();renderTaskbar();if(state.stage>=3&&Math.random()<.25)showError('Ты никуда не уйдешь :)','Окно закрылось, но система осталась.','0xC105E',1700)});win.querySelector('[data-min]').addEventListener('click',()=>{win.classList.add('hidden');renderTaskbar()});win.querySelector('[data-max]').addEventListener('click',()=>{win.classList.toggle('max');if(!win.classList.contains('max')){win.style.left='50%';win.style.top='50%';win.style.transform='translate(-50%,-50%)'}});win.addEventListener('pointerdown',()=>{win.style.zIndex=++z;topId=win.dataset.id;renderTaskbar()})}

function startBattleGame(win){battle={errors:0,phase:1,time:20,alive:true,bullets:[],timer:null,spawn:null};const box=win.querySelector('#battlebox');const soul=win.querySelector('#soul');if(!box||!soul)return;function spawn(){if(!battle||!battle.alive)return;const b=document.createElement('div');b.className='bullet';b.style.left=Math.random()*92+'%';b.style.top='-24px';box.appendChild(b);battle.bullets.push({el:b,y:-24,x:parseFloat(b.style.left)});setTimeout(()=>{if(b.isConnected)b.remove()},4500)}battle.spawn=setInterval(spawn,Math.max(260,650-battle.phase*100));battle.timer=setInterval(()=>{if(!battle||!battle.alive)return;battle.time--;const t=win.querySelector('#battleTime');if(t)t.textContent='00:'+String(Math.max(0,battle.time)).padStart(2,'0');const phase=win.querySelector('#battlePhase');if(phase)phase.textContent='Фаза '+battle.phase+' / 3';const hp=win.querySelector('#battleHP');if(hp)hp.textContent='Ошибки: '+battle.errors+' / 5';battle.bullets.forEach(o=>{o.y+=5+battle.phase*1.4;o.el.style.top=o.y+'px';const r=o.el.getBoundingClientRect(),s=soul.getBoundingClientRect();if(r.left<s.right&&r.right>s.left&&r.top<s.bottom&&r.bottom>s.top){o.el.remove();battle.errors++;if(hp)hp.textContent='Ошибки: '+battle.errors+' / 5';if(battle.errors>=5)endBattle(false,win)}});battle.bullets=battle.bullets.filter(o=>o.el.isConnected);if(battle.time<=0){if(battle.phase<3){battle.phase++;battle.time=18;toast('Фаза '+battle.phase+': атаки ускорились')}else endBattle(true,win)}},1000)}

const mazeWalls=new Set(['1,1','1,2','1,4','2,4','3,1','3,2','3,4','4,2','5,2','5,4','2,6']);let mazePos={x:0,y:0},mazeMoves=0,mazeFails=0,mazeGrid=[];
function startChaseGame(win){mazePos={x:0,y:0};mazeMoves=0;mazeFails=0;mazeGrid=[];renderMaze(win);}
function renderMaze(win){const el=win.querySelector('#maze');if(!el)return;mazeGrid=[];for(let y=0;y<7;y++)for(let x=0;x<7;x++){let wall=mazeWalls.has(x+','+y);if(state.stage>=3&&Math.random()<.035&&!(x===0&&y===0)&&!(x===6&&y===6))wall=!wall;mazeGrid.push({x,y,wall})}mazeGrid.find(c=>c.x===0&&c.y===0).wall=false;mazeGrid.find(c=>c.x===6&&c.y===6).wall=false;el.innerHTML=mazeGrid.map(c=>`<button class="cell ${c.wall?'wall':''} ${c.x===mazePos.x&&c.y===mazePos.y?'you':''} ${c.x===6&&c.y===6?'exit':''}" data-cell="${c.x},${c.y}" aria-label="Клетка ${c.x+1}, ${c.y+1}">${c.x===mazePos.x&&c.y===mazePos.y?'●':c.x===6&&c.y===6?'⇧':''}</button>`).join('');el.querySelectorAll('[data-cell]').forEach(b=>b.addEventListener('click',()=>{const [x,y]=b.dataset.cell.split(',').map(Number);const dx=x-mazePos.x,dy=y-mazePos.y;if(Math.abs(dx)+Math.abs(dy)===1)moveMaze(dx===1?'right':dx===-1?'left':dy===1?'down':'up')}));updateMazeHUD(win)}
function moveMaze(dir){const win=openWindows.chase;if(!win||!chaseAllowed())return;let {x,y}=mazePos;if(dir==='up')y--;if(dir==='down')y++;if(dir==='left')x--;if(dir==='right')x++;if(x<0||x>6||y<0||y>6){mazeFails++;win.querySelector('#chaseMsg').textContent='Переход за границу. Глитч отбрасывает тебя назад.';updateMazeHUD(win);return}const cell=mazeGrid.find(c=>c.x===x&&c.y===y);if(!cell||cell.wall){mazeFails++;win.querySelector('#chaseMsg').textContent=['Путь закрыт.','Это была подделка.','Глитч изменил проход.'][mazeFails%3];if(mazeFails>=3){mazePos={x:0,y:0};mazeFails=0;win.querySelector('#chaseMsg').textContent='Маршрут сброшен. Система не забыла твою ошибку.'}renderMaze(win);return}mazePos={x,y};mazeMoves++;if(mazeMoves%4===0&&state.stage>=2){const ix=Math.floor(Math.random()*mazeGrid.length);if(!(mazeGrid[ix].x===0&&mazeGrid[ix].y===0)&&!(mazeGrid[ix].x===6&&mazeGrid[ix].y===6))mazeGrid[ix].wall=!mazeGrid[ix].wall;win.querySelector('#chaseMsg').textContent='Лабиринт сдвинулся. Запоминай новые проходы.'}if(x===6&&y===6){state.chaseWins++;state.flags.glitchSolved=true;state.inventory.push('фрагмент перехода');state.puzzleSolved=state.bossWins>0;save();win.querySelector('#chaseMsg').textContent='ВЫХОД НАЙДЕН. Глитч отступает — пока что.';toast('Погоня пройдена!');if(state.stage>=3)state.flags.freePass=true;}renderMaze(win);updateMazeHUD(win);save()}
function chaseAllowed(){return !!openWindows.chase}
function updateMazeHUD(win){const s=win.querySelector('#chaseStep'),l=win.querySelector('#chaseLives');if(s)s.textContent='Ходы: '+mazeMoves+' / 24';if(l)l.textContent='Сбои: '+mazeFails+' / 3'}
function solveArchive(win){const key=win.querySelector('#archiveKey').value.trim();const msg=win.querySelector('#archiveMsg');state.attempts++;if(key==='2417'&&state.bossWins>0&&state.chaseWins>0){state.archiveSolved=true;state.puzzleSolved=true;state.flags.freePass=true;state.secretCount++;save();msg.textContent='КЛЮЧ ПРИНЯТ. Архив открыт. Теперь система слышит тебя.';toast('СЕКРЕТНЫЙ АРХИВ ОТКРЫТ');setTimeout(()=>openApp('archive',true),500);if(state.bossWins&&state.chaseWins)endingPrompt()}else if(key==='2417'){msg.textContent='Ключ верный, но отсутствуют два подтверждения: душа и переход.'}else{msg.textContent='Неверно. Порядок подсказок не равен порядку цифр. Ошибка '+state.attempts+'.';if(state.attempts%3===0){disturb();showError('НЕ ПЕРЕБИРАЙ','Архив записывает каждую попытку.','0xA11CE',1700)}}save()}
function endingPrompt(){if(state.bossWins&&state.chaseWins&&state.archiveSolved&&!state.ending){state.ending='unlocked';toast('ОТКРЫТА СЕКРЕТНАЯ КОНЦОВКА',5000);setTimeout(()=>showError('ПОЛЬЗОВАТЕЛЬ НАЙДЕН','Ты собрал всё. Теперь выбери, что делать с системой.','0xEND0',0),900);const shade=$('#popupShade');const row=shade.querySelector('.row:last-child');row.innerHTML='<button id="endRestore">ВОССТАНОВИТЬ</button><button id="endStay">ОСТАТЬСЯ</button>';$('#endRestore').onclick=()=>finishEnding('restore');$('#endStay').onclick=()=>finishEnding('stay');save()}}
function finishEnding(kind){state.ending=kind;save();$('#popupShade').classList.add('hidden');const win=openWindows.notes||Object.values(openWindows)[0];if(win){const c=win.querySelector('.content');c.innerHTML=`<div class="ending"><h1>${kind==='restore'?'SYSTEM RESTORED':'GUEST FOREVER'}</h1><p>${kind==='restore'?'Система восстановлена. Но в корзине остался один файл.':'Ты остался. На рабочем столе появляется новая иконка: ADMIN.'}</p><p class="muted">Концовка ${kind==='restore'?'01':'02'} / 03</p><button id="endingRestart">Вернуться на рабочий стол</button></div>`;win.querySelector('#endingRestart').onclick=()=>{c.innerHTML='<h2>Рабочий стол восстановлен</h2><p>Не все процессы завершены.</p>';}}toast('Концовка сохранена');}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='corrupted-os-save.json';a.click();URL.revokeObjectURL(url);toast('Экспорт сохранения создан')}
function resetAllProgress(){const approved=window.confirm('ПОЛНЫЙ СБРОС CORRUPTED OS?\n\nБудут удалены все локальные сохранения этой игры: сюжет, уровень аномалий, победы, секреты, концовки, заметки и настройки. Отменить действие после подтверждения нельзя.');if(!approved)return;try{for(const key of Object.keys(localStorage)){if(/^corrupted[-_]?os/i.test(key))localStorage.removeItem(key)}for(const key of Object.keys(sessionStorage)){if(/^corrupted[-_]?os/i.test(key))sessionStorage.removeItem(key)}}catch(e){try{localStorage.removeItem('corruptedOS_save')}catch(_){} }location.reload()}
function boot(){if(!state.startedAt){state.startedAt=Date.now();save()}if(state.flags.reduceMotion)$('#desktop').classList.remove('scanlines');else $('#desktop').classList.add('scanlines');openApp('browser',true);const w=openWindows.browser;w.querySelector('#webPage').innerHTML='<h3>Welcome.local</h3><p>Добро пожаловать в CORRUPTED OS.</p><p class="green">Все системы работают штатно.</p><p>Осмотрись. Здесь несколько приложений и файлов.</p><div class="row"><button data-page="forum">Форум</button><button data-page="help">Помощь</button><button data-page="404">404</button></div>';w.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(w,b.dataset.page)));if(state.stage>=3){toast('Сессия восстановлена. Уровень аномалий: '+state.stage,3500);setTimeout(()=>showError('Ты никуда не уйдешь :)','Ты вернулся. Система это заметила.','0xRELOAD',1800),2000)}setInterval(tick,1000);}
boot();
})();
</script></body></html>
